        const TopScorersTable = ({ scorers, sport = 'Fútbol' }) => {

        const InteractiveCalendar = ({ matches, selectedDateFilter, onSelectDate, inaugurationDate }) => {
            const [viewDate, setViewDate] = useState(() => {
                if (matches.length > 0) {
                    const firstDate = matches.map(m => m.date).filter(Boolean).sort()[0];
                    if (firstDate) return new Date(firstDate + 'T00:00:00');
                }
                return new Date();
            });

            useEffect(() => {
                if (selectedDateFilter) {
                    const d = new Date(selectedDateFilter + 'T00:00:00');
                    if (!isNaN(d.getTime())) {
                        if (d.getFullYear() !== viewDate.getFullYear() || d.getMonth() !== viewDate.getMonth()) {
                            setViewDate(d);
                        }
                    }
                }
            }, [selectedDateFilter]);

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();

            const monthNames = [
                'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = new Date(year, month, 1).getDay();

            const matchesByDate = useMemo(() => {
                const map = {};
                matches.forEach(m => {
                    if (m.date) {
                        map[m.date] = (map[m.date] || 0) + 1;
                    }
                });
                return map;
            }, [matches]);

            const prevMonth = () => {
                onSelectDate('');
                setViewDate(new Date(year, month - 1, 1));
            };

            const nextMonth = () => {
                onSelectDate('');
                setViewDate(new Date(year, month + 1, 1));
            };

            const daysArray = [];
            for (let i = 0; i < firstDayIndex; i++) {
                daysArray.push(null);
            }
            for (let day = 1; day <= daysInMonth; day++) {
                daysArray.push(day);
            }

            return (
                <div className="card p-6 md:p-8 space-y-6 animate-fade-in-up">

                            <button onClick={prevMonth} className="text-slate-600 dark:text-slate-300 hover:text-[#101097] dark:hover:text-blue-400 p-1 font-bold">
                                ←
                            </button>
                            <span className="text-sm font-bold font-outfit text-[#101097] dark:text-blue-300 min-w-[120px] text-center">
                                {monthNames[month]} {year}
                            </span>
                            <button onClick={nextMonth} className="text-slate-600 dark:text-slate-300 hover:text-[#101097] dark:hover:text-blue-400 p-1 font-bold">
                                →
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-7 gap-2 text-center text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 font-outfit pb-2">
                        <span>DOM</span>
                        <span>LUN</span>
                        <span>MAR</span>
                        <span>MIÉ</span>
                        <span>JUE</span>
                        <span>VIE</span>
                        <span>SÁB</span>
                    </div>

                    <div className="grid grid-cols-7 gap-2 min-h-[260px]">

                            if (day === null) {
                                return <div key={`empty-${idx}`} className="h-16 rounded-xl"></div>;
                            }

                            const monthStr = String(month + 1).padStart(2, '0');
                            const dayStr = String(day).padStart(2, '0');
                            const dateKey = `${year}-${monthStr}-${dayStr}`;
                            const count = matchesByDate[dateKey] || 0;
                            const isSelected = selectedDateFilter === dateKey;

                            const isInauguration = inaugurationDate && dateKey === inaugurationDate;

                            if (count > 0 || isInauguration) {
                                return (
                                    <button
                                        key={dateKey}
                                        onClick={() => onSelectDate(isSelected ? '' : dateKey)}
                                        className={`h-16 rounded-2xl flex flex-col items-center justify-center transition-all duration-200 shadow-md ${
                                            isInauguration
                                                ? 'bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 ring-4 ring-amber-400/60 scale-105 font-bold'
                                                : isSelected
                                                ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white ring-4 ring-blue-400/50 scale-105 font-bold'
                                                : 'bg-gradient-to-r from-[#101097] to-[#2a2ad9] text-white hover:scale-105 hover:shadow-lg'
                                        }`}

                                        <span className="text-base font-extrabold font-outfit leading-none">{day}</span>
                                        <span className={`text-[10px] mt-1 px-2 py-0.5 rounded-full font-semibold whitespace-nowrap ${isInauguration ? 'bg-slate-950/20 text-slate-950 font-bold' : 'bg-white/20'}`}>
                                            {isInauguration ? '🎉 Inauguración' : `${count} ${count === 1 ? 'partido' : 'partidos'}`}
                                        </span>
                                    </button>
                                );
                            }

                            return (
                                <div
                                    key={dateKey}
                                    className="h-16 rounded-xl border border-slate-100 dark:border-slate-800/40 flex items-center justify-center text-sm font-medium text-slate-400 dark:text-slate-600 opacity-60"
                                >
                                    {day}
                                </div>
                            );
                        })}
                    </div>

                    <div className="flex items-center space-x-2 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400 font-medium">
                        <span className="w-2.5 h-2.5 rounded-full bg-[#101097] dark:bg-blue-500 inline-block"></span>

                                Limpiar filtro ({selectedDateFilter})
                            </span>
                        )}
                    </div>
                </div>
            );
        };

        const ResultsList = ({ matches, getTeamName, getTeamLogo, onMatchClick }) => {
            const [isExpanded, setIsExpanded] = useState(false);
            const recentMatches = matches.filter(m => m.scoreHome !== null).sort((a, b) => new Date(b.date) - new Date(a.date));

            if (recentMatches.length === 0) {
                return <p className="text-center text-sm text-slate-500 dark:text-slate-400 py-4">No hay resultados recientes.</p>;
            }

            const visibleMatchesList = isExpanded ? recentMatches : recentMatches.slice(0, 3);

            return (
                <div className="space-y-3 mt-4">
                    {visibleMatchesList.map(match => (
                        <div key={match.id} onClick={() => onMatchClick(match)} className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl hover:shadow-lg hover:bg-white dark:hover:bg-slate-800 cursor-pointer transition-all duration-200 shadow-sm border border-slate-100 dark:border-slate-700">
                            <p className="text-xs text-slate-400 dark:text-slate-500 uppercase tracking-wider font-semibold mb-2">{new Date(match.date).toLocaleDateString('es-ES', { year: 'numeric', month: 'short', day: 'numeric' })}</p>

                        <div className="text-center mb-6">
                            <p className="text-sm text-slate-400 dark:text-slate-500 uppercase tracking-wider font-semibold mb-2">{new Date(match.date).toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>

                                <div className="space-y-2">

                                    <ul className="space-y-1">
                                        {homeScorers.map((scorer, i) => <li key={i} className="text-sm text-slate-700 dark:text-slate-200 flex justify-between"><span>{getPlayerName(scorer.playerId)}</span> <span className="font-bold text-[#101097] dark:text-blue-400">{scorer.count}</span></li>)}

                                        {awayScorers.map((scorer, i) => <li key={i} className="text-sm text-slate-700 dark:text-slate-200 flex justify-between"><span>{getPlayerName(scorer.playerId)}</span> <span className="font-bold text-[#101097] dark:text-blue-400">{scorer.count}</span></li>)}
                                    </ul>
                                    {awayScorers.length === 0 && <p className="text-sm text-slate-400 italic">Sin anotadores.</p>}

        const EditTeamModal = ({ team, onClose, onSave, showMessage, onOpenCountrySelector }) => {

            const [name, setName] = useState(team.name);
            const [logoUrl, setLogoUrl] = useState(team.logoUrl);

            const handleSave = () => {
                if (!name.trim() || !logoUrl.trim()) {
                    showMessage("El nombre y la URL del logo no pueden estar vacíos.");
                    return;
                }
                onSave(team.id, name, logoUrl);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md p-4">
                    <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full text-left border-t-4 border-[#101097] animate-fade-in-up">

                        <div className="space-y-4">

            if (!team) return null;
            const [playerNames, setPlayerNames] = useState('');

            const handleAdd = () => {
                const names = playerNames.split('\n').map(name => name.trim()).filter(name => name);
                if (names.length === 0) {
                    showMessage("Por favor, introduce al menos un nombre de jugador.");
                    return;

            return (

        const MatchesView = ({ matches, getTeamName, appId, db, showMessage, leagues, players, getLeagueName, getPlayersByTeam, selectedDateFilter, selectedLeagueFilter, inaugurationDate, user }) => {
            const [selectedMatch, setSelectedMatch] = useState(null);
            const [scoreHome, setScoreHome] = useState(0);
            const [scoreAway, setScoreAway] = useState(0);
            const [scorers, setScorers] = useState([]);
            const [isEditing, setIsEditing] = useState(false);

            const handleEditMatch = (match) => {
                setSelectedMatch(match);
                setScoreHome(match.scoreHome !== null ? match.scoreHome : 0);
                setScoreAway(match.scoreAway !== null ? match.scoreAway : 0);
                setScorers(match.scorers || []);
                setIsEditing(true);
            };

            const handleSaveMatch = async () => {
                if (!selectedMatch) return;
                try {
                    if (window.firebaseModules && db) {
                        const { doc, setDoc } = window.firebaseModules;
                        await setDoc(doc(db, `artifacts/${appId}/public/data/matches`, selectedMatch.id), {
                            ...selectedMatch,
                            scoreHome: parseInt(scoreHome, 10),
                            scoreAway: parseInt(scoreAway, 10),
                            scorers,
                        });
                    }
                    const homeTeamName = getTeamName(selectedMatch.homeTeamId);
                    const awayTeamName = getTeamName(selectedMatch.awayTeamId);
                    const validScorers = (scorers || []).filter(s => s.playerId && s.count > 0);
                    let scorersMessage = "";
                    if (validScorers.length > 0) {
                        scorersMessage = "\nAnotadores:\n" + validScorers.map(s => {
                            const pName = (players || []).find(p => p.id === s.playerId)?.name || 'Jugador';
                            const tName = getTeamName(s.teamId);
                            return `- ${pName} (${tName}): ${s.count}`;
                        }).join('\n');
                    }
                    const notificationMessage = `Resultado de Partido Registrado\n\n` +
                        `Liga: ${getLeagueName(selectedMatch.leagueId)}\n` + 
                        `Fecha: ${selectedMatch.date}\n\n` + 
                        `Resultado Final:\n` + 
                        `${homeTeamName} ${scoreHome} - ${scoreAway} ${awayTeamName}\n` + 
                        `${scorersMessage}`;
                    sendTelegramNotification(notificationMessage, user?.email);

                    setIsEditing(false);
                    setSelectedMatch(null);
                    showMessage("Partido actualizado con éxito.");
                } catch (e) {
                    console.error("Error al guardar el partido:", e);
                    showMessage("Error al guardar el partido.");
                }
            };

            const handleAddScorer = (teamId) => {
                setScorers(prev => [...prev, { playerId: '', teamId, count: 1 }]);
            };

            const handleScorerChange = (index, field, value) => {
                const newScorers = [...scorers];
                newScorers[index][field] = value;
                setScorers(newScorers);
            };

            const handleRemoveScorer = (index) => {
                setScorers(prev => prev.filter((_, i) => i !== index));
            };

            const handleNullifyMatch = async () => {
                if (!selectedMatch) return;
                if (confirm("¿Estás seguro de que quieres anular este partido? Se registrará como empate 0-0.")) {
                    try {
                        if (window.firebaseModules && db) {
                            const { doc, setDoc } = window.firebaseModules;
                            await setDoc(doc(db, `artifacts/${appId}/public/data/matches`, selectedMatch.id), {
                                ...selectedMatch,
                                scoreHome: 0,
                                scoreAway: 0,
                                scorers: [],
                                status: 'Anulado'
                            });
                        }
                        const notificationMessage = `Partido Anulado\n\n` +
                            `Liga: ${getLeagueName(selectedMatch.leagueId)}\n` +
                            `Fecha: ${selectedMatch.date}\n\n` +
                            `Partido:\n` +
                            `${getTeamName(selectedMatch.homeTeamId)} vs ${getTeamName(selectedMatch.awayTeamId)}\n\n` +
                            `El partido ha sido anulado y registrado como un empate 0-0.`;
                        sendTelegramNotification(notificationMessage, user?.email);

                        setIsEditing(false);
                        setSelectedMatch(null);
                        showMessage("Partido anulado con éxito (0-0).");
                    } catch (e) {
                        console.error("Error al anular el partido:", e);
                        showMessage("Error al anular el partido.");
                    }

            };

            const filteredMatches = matches.filter(match => {
                const dateMatch = selectedDateFilter ? match.date === selectedDateFilter : true;
                const leagueMatch = selectedLeagueFilter ? match.leagueId === selectedLeagueFilter : true;
                return dateMatch && leagueMatch;

            const sortedMatches = [...filteredMatches].sort((a, b) => new Date(a.date) - new Date(b.date));

            return (
                <div className="space-y-6">
                    {isEditing && selectedMatch ? (

                            <div className="flex flex-wrap items-center gap-6 bg-slate-50 dark:bg-slate-900/50 p-6 rounded-2xl">
                                <div className="flex-1 min-w-[150px]">
                                    <label className="text-sm font-medium text-slate-600 dark:text-slate-300 block mb-1">Local</label>
                                    <div className="flex items-center gap-2">
                                        <input type="number" min="0" value={scoreHome} onChange={(e) => setScoreHome(Math.max(0, parseInt(e.target.value, 10)))} className="input-modern text-center text-xl font-bold font-outfit w-20" />
                                        <span className="font-bold text-slate-700 dark:text-slate-200 font-outfit">{getTeamName(selectedMatch.homeTeamId)}</span>
                                    </div>
                                </div>
                                <div className="flex-1 min-w-[150px]">
                                    <label className="text-sm font-medium text-slate-600 dark:text-slate-300 block mb-1">Visitante</label>
                                    <div className="flex items-center gap-2">
                                        <span className="font-bold text-slate-700 dark:text-slate-200 font-outfit">{getTeamName(selectedMatch.awayTeamId)}</span>
                                        <input type="number" min="0" value={scoreAway} onChange={(e) => setScoreAway(Math.max(0, parseInt(e.target.value, 10)))} className="input-modern text-center text-xl font-bold font-outfit w-20" />
                                    </div>

                            <div className="space-y-4">
                                <h5 className="text-lg font-bold font-outfit text-slate-800 dark:text-slate-200">Anotadores</h5>

                                    <button onClick={() => handleAddScorer(selectedMatch.homeTeamId)} className="btn-primary text-sm py-2 px-4">+ Local</button>
                                    <button onClick={() => handleAddScorer(selectedMatch.awayTeamId)} className="btn-primary text-sm py-2 px-4">+ Visitante</button>

                                    <div key={index} className="flex flex-wrap items-center gap-2 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                                        <select value={scorer.playerId} onChange={(e) => handleScorerChange(index, 'playerId', e.target.value)} className="input-modern flex-1 min-w-[150px] py-2">

                                <button onClick={() => setIsEditing(false)} className="btn-secondary flex-1">Cancelar</button>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-8">
                            {filteredMatches.length === 0 ? (
                                <p className="text-center text-slate-500 dark:text-slate-400 py-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl">
                                    No hay partidos para mostrar con los filtros aplicados.
                                </p>
                            ) : (
                                leagues
                                    .filter(l => selectedLeagueFilter ? l.id === selectedLeagueFilter : true)
                                    .sort(sortLeagues)
                                    .map(league => {
                                        const leagueMatches = filteredMatches
                                            .filter(m => m.leagueId === league.id)
                                            .sort((a, b) => new Date(a.date) - new Date(b.date));

                                        if (leagueMatches.length === 0) return null;

                                        return (
                                            <div key={league.id} className="bg-slate-50/70 dark:bg-slate-900/40 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-4 animate-fade-in-up">
                                                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                                                    <h4 className="text-lg font-bold font-outfit text-slate-900 dark:text-white flex items-center">
                                                        <SportIcon sport={league.sport} />
                                                        <span className="ml-2">{league.name}</span>

                                                        {leagueMatches.length} {leagueMatches.length === 1 ? 'partido' : 'partidos'}

                                                                key={match.id}
                                                                className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/80 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:shadow-md transition-all"

                                                                        📅 {match.date}

                                                                            🤝 Amistoso
                                                                        </span>

                                                                        <span className="text-[10px] font-bold font-outfit uppercase tracking-wider px-2 py-0.5 rounded-md bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700/60">
                                                                            🏆 Oficial
                                                                        </span>
                                                                    )}
                                                                </div>

                                                                    <div className="flex-1 text-right flex items-center justify-end space-x-2">

                                                                            {getTeamName(match.homeTeamId)}
                                                                        </span>

                                                                        {match.scoreHome !== null ? `${match.scoreHome} - ${match.scoreAway}` : 'VS'}
                                                                    </div>

                                                                            {getTeamName(match.awayTeamId)}
                                                                        </span>

                                                                </div>

                                                                <div className="flex items-center space-x-2 justify-end">

                                                                            ANULADO
                                                                        </span>
                                                                    )}
                                                                    <button
                                                                        onClick={() => handleEditMatch(match)}
                                                                        className="btn-primary text-xs py-2 px-3 flex items-center space-x-1"

                                                                        <EditIcon />
                                                                        <span>Editar</span>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const LeagueCard = ({ league, teams, players, appId, db, showMessage, onMatchDayChange, onEditTeam, onAddPlayers, onAddNewTeam, onOpenCountrySelector }) => {
            const [isExpanded, setIsExpanded] = useState(false);

            const handleDeletePlayer = async (playerId) => {
                if (confirm("¿Estás seguro de que quieres eliminar a este alumno de la plantilla?")) {
                    try {
                        if (window.firebaseModules && db) {
                            const { doc, deleteDoc } = window.firebaseModules;
                            await deleteDoc(doc(db, `artifacts/${appId}/public/data/players`, playerId));
                        }
                        showMessage("Alumno eliminado con éxito.");
                    } catch (e) { console.error("Error al eliminar alumno:", e); showMessage("Error al eliminar."); }
                }
            };

            return (

                const result = new Date(date);
                // Si la fecha actual no es miércoles (getDay() !== 3), avanzar al siguiente miércoles
                const dayOfWeek = result.getDay();
                const daysUntilWednesday = (3 - dayOfWeek + 7) % 7;
                result.setDate(result.getDate() + daysUntilWednesday);

                // Detección estricta de periodos vacacionales del ciclo escolar
                const isVacation = (d) => {
                    const month = d.getMonth(); // 0-indexed: 0=Enero, 11=Diciembre
                    const day = d.getDate();

                    // Vacaciones de Navidad: 19 de Diciembre al 6 de Enero
                    if ((month === 11 && day >= 19) || (month === 0 && day <= 6)) return true;
                    // Vacaciones de Semana Santa: 28 de Marzo al 12 de Abril
                    if ((month === 2 && day >= 28) || (month === 3 && day <= 12)) return true;
                    // Vacaciones de Verano / Fin de curso: Julio y Agosto
                    if (month === 6 || month === 7) return true;

                    return false;
                };

                // Si cae en período vacacional, saltar semana a semana hasta el siguiente miércoles de clases
                while (isVacation(result)) {
                    result.setDate(result.getDate() + 7);
                }

                    let targetEndDate;

                    // Determinar fecha límite según deporte y vacaciones escolares
                    if (currentSport === 'Básquetbol') {
                        // Hasta el miércoles previo a Semana Santa (finales de marzo)
                        targetEndDate = new Date(startYear, 2, 27);
                    } else if (currentSport === 'Voleibol') {
                        // Hasta final de curso (30 de junio)
                        targetEndDate = new Date(startYear, 5, 30);
                    } else {
                        // Fútbol (Torneo 1): Hasta el miércoles previo a vacaciones de Navidad (18 de diciembre)
                        targetEndDate = new Date(startYear, 11, 18);
                    }

                    // Si la fecha límite calculada es anterior al inicio, se ajusta al año siguiente
                    if (targetEndDate < startDateObj) {
                        targetEndDate.setFullYear(targetEndDate.getFullYear() + 1);
                    }

                    let totalMatches = 0;

                    for (const league of visLeagues) {
                        const leagueTeams = visTeams.filter(t => t.leagueId === league.id);
                        if (leagueTeams.length < 2) continue;

                        const numTeams = leagueTeams.length;
                        const roundsPerCycle = numTeams % 2 === 0 ? numTeams - 1 : numTeams;
                        let currentDate = getNextValidWednesday(startDateObj);
                        let roundCounter = 0;

                        while (currentDate <= targetEndDate) {
                            let teamList = [...leagueTeams];
                            if (numTeams % 2 !== 0) teamList.push(null); // Bye

                            // Rotar lista para la jornada actual del ciclo
                            const roundInCycle = roundCounter % (roundsPerCycle * 2);
                            for (let r = 0; r < roundInCycle; r++) {
                                teamList.splice(1, 0, teamList.pop());
                            }

                            for (let i = 0; i < teamList.length / 2; i++) {
                                const home = teamList[i];
                                const away = teamList[teamList.length - 1 - i];

                                if (home && away) {
                                    const wednesdayStr = currentDate.toISOString().split('T')[0];
                                    let assignedDate = wednesdayStr;
                                    let isFriendlyMatch = false;

                                    if (currentTournament?.inaugurationDate) {
                                        const inaug = new Date(currentTournament.inaugurationDate + 'T00:00:00');

                                        const daysToSubtract = (dayOfWeek - 3 + 7) % 7 || 7;
                                        const wednesdayBefore = new Date(inaug);
                                        wednesdayBefore.setDate(wednesdayBefore.getDate() - daysToSubtract);
                                        const wednesdayBeforeStr = wednesdayBefore.toISOString().split('T')[0];

                                        if (wednesdayStr === wednesdayBeforeStr) {
                                            assignedDate = currentTournament.inaugurationDate;
                                            isFriendlyMatch = false; // ¡El día de inauguración SÍ cuenta como 1er partido oficial!
                                        } else if (assignedDate < currentTournament.inaugurationDate) {
                                            isFriendlyMatch = true; // Partidos anteriores son amistosos
                                        } else {
                                            isFriendlyMatch = false; // Partidos posteriores son oficiales
                                        }
                                    } else {

                                        isFriendlyMatch = true;
                                    }

                                    const matchId = `match_${league.id}_${assignedDate}_${home.id}_vs_${away.id}`;

                                        leagueId: league.id,
                                        homeTeamId: roundInCycle % 2 === 0 ? home.id : away.id,
                                        awayTeamId: roundInCycle % 2 === 0 ? away.id : home.id,

                                        scoreAway: null,
                                        scorers: [],
                                        date: assignedDate,
                                        isFriendly: isFriendlyMatch,
                                        status: 'Programado'

            const generateStandingsAndTopScorersPdf = (visLeagues, visTeams, visMatches, visPlayers) => {

                const { jsPDF } = window.jspdf;

                        startY: y + 4,
                        head: [['#', 'Equipo', 'PJ', 'G', 'E', 'P', 'GF', 'GC', 'DG', 'Pts']],
                        body: tableData,
                        theme: 'striped',
                        headStyles: { fillColor: [16, 16, 151], textColor: [255, 255, 255] },
                        styles: { fontSize: 8, cellPadding: 1.5, textColor: [0, 0, 0] }

                    y = doc.lastAutoTable.finalY + 10;

            // Resumen de la Jornada para Facebook & Redes Sociales
            const getFacebookSummaryData = (visMatches, visLeagues, visTeams, visPlayers, selectedDate) => {
                const sortedLeagues = [...visLeagues].sort(sortLeagues);
                
                // Matches with score recorded (played)
                const allPlayedMatches = visMatches.filter(m => m.scoreHome !== null && m.scoreHome !== undefined);
                
                // Get all played dates sorted chronologically
                const playedDates = [...new Set(allPlayedMatches.map(m => m.date))].filter(Boolean).sort();
                
                // Determine target date for results:
                // 1. If explicit selectedDate is passed, use it.
                // 2. Otherwise auto-select the LATEST played date (most recent jornada).
                const targetDate = selectedDate || (playedDates.length > 0 ? playedDates[playedDates.length - 1] : null);

                // Filter played matches to ONLY include targetDate matches
                const playedMatches = targetDate 
                    ? allPlayedMatches.filter(m => m.date === targetDate)
                    : allPlayedMatches;

                // Group played matches by league
                const leagueResultsMap = [];
                sortedLeagues.forEach(league => {
                    const lMatches = playedMatches.filter(m => m.leagueId === league.id);
                    if (lMatches.length > 0) {
                        leagueResultsMap.push({
                            league,
                            matches: lMatches
                        });
                    }
                });

                // Top Scorers / Anotadores for the target jornada
                const playerGoalsMap = {};
                playedMatches.forEach(m => {
                    if (m.scorers && Array.isArray(m.scorers)) {
                        m.scorers.forEach(s => {
                            if (s.playerId && s.count > 0) {
                                playerGoalsMap[s.playerId] = (playerGoalsMap[s.playerId] || 0) + s.count;
                            }
                        });
                    }
                });

                const sortedScorers = Object.keys(playerGoalsMap)
                    .map(pId => {
                        const pObj = (visPlayers || []).find(p => p.id === pId);
                        const tObj = (visTeams || []).find(t => t.id === pObj?.teamId);
                        return {
                            id: pId,
                            name: pObj?.name || 'Alumno',
                            teamName: tObj?.name || 'Equipo',
                            goals: playerGoalsMap[pId]
                        };
                    })
                    .sort((a, b) => b.goals - a.goals);

                let topScorers = [];
                if (sortedScorers.length > 0) {
                    const maxGoals = sortedScorers[0].goals;
                    topScorers = sortedScorers.filter(s => s.goals === maxGoals || s.goals >= Math.max(1, maxGoals - 1));
                }

                // Upcoming matches (all matches for the NEXT pending date)
                const pendingMatches = visMatches.filter(m => m.scoreHome === null || m.scoreHome === undefined);
                const pendingDates = [...new Set(pendingMatches.map(m => m.date))].filter(Boolean).sort();

                const upcomingMatches = nextPendingDate 
                    ? pendingMatches.filter(m => m.date === nextPendingDate)
                    : pendingMatches;

                return { targetDate, leagueResultsMap, topScorers, upcomingMatches };
            };

                htmlContent += `
                                    </div>

                `;

                if (upcomingMatches.length === 0) {

                } else {
                    upcomingMatches.forEach(m => {
                        const home = getTeamName(m.homeTeamId);
                        const away = getTeamName(m.awayTeamId);

                printWindow.document.write(htmlContent);
                printWindow.document.close();
            };

            const loadImgData = (url) => {
                return new Promise((resolve) => {
                    if (!url) return resolve(null);
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = 64;
                            canvas.height = 64;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, 64, 64);
                            resolve(canvas.toDataURL('image/png'));
                        } catch (e) {
                            resolve(null);
                        }
                    };
                    img.onerror = () => resolve(null);
                    img.src = url;
                });
            };

            const generateTeamsAndPlayersRosterPdf = async (visLeagues, visTeams, visPlayers) => {
                if (!window.jspdf) return;
                showMessage("Generando PDF con escudos oficiales de equipos...");
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                const sortedLeagues = [...visLeagues].sort(sortLeagues);

                // Pre-cargar imagenes base64 de los equipos
                const teamLogosMap = {};
                for (const team of visTeams) {
                    if (team.logoUrl && !teamLogosMap[team.id]) {
                        teamLogosMap[team.id] = await loadImgData(team.logoUrl);
                    }
                }

                let isFirstLeague = true;

                for (const league of sortedLeagues) {
                    const leagueTeams = visTeams.filter(t => t.leagueId === league.id);
                    if (leagueTeams.length === 0) continue;

                    // Salto de página por liga (cada liga inicia en nueva página excepto la 1era)
                    if (!isFirstLeague) {
                        doc.addPage();
                    }
                    isFirstLeague = false;

                    // Header de la página / Liga
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(15);
                    doc.setTextColor(16, 16, 151);
                    doc.text("LIGAS LA SALLE TUXTLA — SECUNDARIA", 105, 15, { align: "center" });
                    doc.setFontSize(11);
                    doc.setTextColor(71, 85, 105);
                    doc.text("CÉDULA DE INSCRIPCIÓN Y ROSTER DE EQUIPOS Y ALUMNOS", 105, 22, { align: "center" });
                    doc.setTextColor(0, 0, 0);

                    let y = 32;
                    doc.setFontSize(13);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(16, 16, 151);
                    doc.text(`LIGA: ${league.name.toUpperCase()}`, 14, y);
                    doc.setLineWidth(0.5);
                    doc.setDrawColor(16, 16, 151);
                    doc.line(14, y + 2, 196, y + 2);
                    doc.setTextColor(0, 0, 0);
                    y += 10;

                    for (const team of leagueTeams) {
                        const teamPlayers = visPlayers.filter(p => p.teamId === team.id).sort((a, b) => a.name.localeCompare(b.name));
                        const playerCount = teamPlayers.length;

                        // Cálculo exacto del alto requerido para este equipo completo
                        // Título de equipo: ~8mm, Header de tabla: ~6mm, Alumnos: ~5.2mm c/u, Margen: ~8mm
                        const estimatedTeamHeight = 8 + 6 + (Math.max(1, playerCount) * 5.2) + 8;

                        // Si el equipo no cabe completo en lo que queda de página, salto de página preventivo
                        if (y + estimatedTeamHeight > 275 && y > 45) {
                            doc.addPage();
                            doc.setFont("helvetica", "bold");
                            doc.setFontSize(11);
                            doc.setTextColor(16, 16, 151);
                            doc.text(`LIGA: ${league.name.toUpperCase()} (Continuación)`, 14, 15);
                            doc.setLineWidth(0.3);
                            doc.setDrawColor(16, 16, 151);
                            doc.line(14, 17, 196, 17);
                            doc.setTextColor(0, 0, 0);
                            y = 24;
                        }

                        const logoBase64 = teamLogosMap[team.id];
                        if (logoBase64) {
                            try {
                                doc.addImage(logoBase64, 'PNG', 14, y - 5, 7, 7);
                            } catch (e) {}
                            doc.setFontSize(11);
                            doc.setFont("helvetica", "bold");
                            doc.text(`Equipo: ${team.name} (${playerCount} alumnos)`, 23, y);
                        } else {
                            doc.setFontSize(11);
                            doc.setFont("helvetica", "bold");
                            doc.text(`• Equipo: ${team.name} (${playerCount} alumnos)`, 14, y);
                        }
                        y += 4;

                        const tableBody = teamPlayers.length > 0
                            ? teamPlayers.map((p, idx) => [idx + 1, p.name])
                            : [['-', 'Sin alumnos registrados']];

                        doc.autoTable({
                            startY: y,
                            margin: { left: 14, right: 14 },
                            head: [['#', 'Nombre del Alumno / Jugador']],
                            body: tableBody,
                            theme: 'grid',
                            pageBreak: 'avoid',
                            headStyles: { fillColor: [16, 16, 151], textColor: [255, 255, 255], fontStyle: 'bold' },
                            styles: { fontSize: 8.5, cellPadding: 1.8 }
                        });

                        y = doc.lastAutoTable.finalY + 8;
                    }
                }

                doc.save(`roster_equipos_alumnos_secundaria_${selectedTournamentId}.pdf`);
                showMessage("PDF de Roster de Equipos y Alumnos generado con éxito.");

                        </div>
                        <h1>LIGAS LA SALLE TUXTLA — SECUNDARIA</h1>
                        <h2>Cédula Oficial de Inscripción y Roster de Equipos y Alumnos</h2>
                `;

                sortedLeagues.forEach(league => {
                    const leagueTeams = visTeams.filter(t => t.leagueId === league.id);
                    if (leagueTeams.length === 0) return;

                    htmlContent += `
                        <div class="league-section">
                            <div class="league-title">Liga: ${league.name}</div>
                            <div class="team-grid">
                    `;

                    leagueTeams.forEach(team => {
                        const teamPlayers = visPlayers.filter(p => p.teamId === team.id).sort((a, b) => a.name.localeCompare(b.name));
                        htmlContent += `
                            <div class="team-card">
                                <div class="team-header">
                                    <img src="${team.logoUrl}" class="team-logo" alt="" />
                                    <span class="team-name">${team.name}</span>
                                    <span class="player-count">${teamPlayers.length} Alumnos</span>
                                </div>
                                <ol>
                                    ${teamPlayers.length > 0 ? teamPlayers.map(p => `<li>${p.name}</li>`).join('') : '<li style="list-style: none; color: #94a3b8; font-style: italic;">Sin alumnos registrados</li>'}
                                </ol>
                            </div>
                        `;
                    });

                    htmlContent += `
                            </div>
                        </div>
                    `;
                });

                htmlContent += `
                    </body>
                    </html>
                `;

                printWindow.document.write(htmlContent);
                printWindow.document.close();
            };

            // Filtrados por torneo seleccionado
            const visibleLeagues = useMemo(() => leagues.filter(l => l.tournamentId === selectedTournamentId), [leagues, selectedTournamentId]);
            const visibleLeagueIds = useMemo(() => visibleLeagues.map(l => l.id), [visibleLeagues]);
            const visibleTeams = useMemo(() => teams.filter(t => visibleLeagueIds.includes(t.leagueId)), [teams, visibleLeagueIds]);
            const visibleTeamIds = useMemo(() => visibleTeams.map(t => t.id), [visibleTeams]);
            const visiblePlayers = useMemo(() => players.filter(p => visibleTeamIds.includes(p.teamId)), [players, visibleTeamIds]);
            const visibleMatches = useMemo(() => matches.filter(m => visibleLeagueIds.includes(m.leagueId)), [matches, visibleLeagueIds]);

            const getLeagueName = useCallback((leagueId) => leagues.find(l => l.id === leagueId)?.name || 'Liga Desconocida', [leagues]);
            const getPlayersByTeam = useCallback((teamId) => players.filter(p => p.teamId === teamId), [players]);

            // Cálculo de Clasificaciones (excluyendo partidos amistosos anteriores a la inauguración)
            const calculateStandings = useCallback((leagueId, teamsList, matchesList) => {
                const leagueTeams = teamsList.filter(t => t.leagueId === leagueId);
                const inaugDate = currentTournament?.inaugurationDate;
                const leagueMatches = matchesList.filter(m => {
                    if (m.leagueId !== leagueId || m.scoreHome === null) return false;
                    if (m.isFriendly) return false;
                    if (inaugDate && m.date && m.date < inaugDate) return false;
                    return true;
                });

                const standingsMap = {};
                leagueTeams.forEach(team => {
                    standingsMap[team.id] = { id: team.id, teamName: team.name, logoUrl: team.logoUrl, played: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0, goalDifference: 0, points: 0 };
                });

                leagueMatches.forEach(m => {
                    const home = standingsMap[m.homeTeamId];
                    const away = standingsMap[m.awayTeamId];
                    if (!home || !away) return;

                    home.played++; away.played++;
                    home.goalsFor += m.scoreHome; home.goalsAgainst += m.scoreAway;
                    away.goalsFor += m.scoreAway; away.goalsAgainst += m.scoreHome;

                    if (m.scoreHome > m.scoreAway) { home.wins++; home.points += 3; away.losses++; }
                    else if (m.scoreAway > m.scoreHome) { away.wins++; away.points += 3; home.losses++; }
                    else { home.draws++; home.points += 1; away.draws++; away.points += 1; }
                });

                return Object.values(standingsMap).map(t => ({ ...t, goalDifference: t.goalsFor - t.goalsAgainst }))
                    .sort((a, b) => b.points - a.points || b.goalDifference - a.goalDifference || b.goalsFor - a.goalsFor);
            }, [currentTournament]);

            // Cálculo de Máximos Anotadores
            const calculateTopScorers = useCallback((leagueId, matchesList, playersList, teamsList) => {
                const inaugDate = currentTournament?.inaugurationDate;
                const leagueMatches = matchesList.filter(m => {
                    if (m.leagueId !== leagueId || !m.scorers?.length) return false;
                    if (m.isFriendly) return false;
                    if (inaugDate && m.date && m.date < inaugDate) return false;
                    return true;
                });
                const scorerCounts = {};

                leagueMatches.forEach(m => {
                    m.scorers.forEach(s => {
                        if (!s.playerId) return;
                        scorerCounts[s.playerId] = (scorerCounts[s.playerId] || 0) + (s.count || 1);
                    });
                });

                return Object.entries(scorerCounts).map(([playerId, goals]) => {
                    const player = playersList.find(p => p.id === playerId);
                    const team = teamsList.find(t => t.id === player?.teamId);
                    return { playerName: player?.name || 'Desconocido', teamName: team?.name || 'Sin equipo', logoUrl: team?.logoUrl || '', goals };
                }).sort((a, b) => b.goals - a.goals).slice(0, 10);
            }, [currentTournament]);

            // Objeto del torneo activo
            const currentTournament = tournaments.find(t => t.id === selectedTournamentId);
            const currentSport = currentTournament?.sport || 'Fútbol';

            // Cálculo dinámico de Estadísticas para el Hero Banner (General o por Liga)
            const heroStats = useMemo(() => {
                const isFiltered = Boolean(selectedStandingsLeagueFilter);
                const targetLeagues = isFiltered 
                    ? visibleLeagues.filter(l => l.id === selectedStandingsLeagueFilter)
                    : visibleLeagues;
                const targetMatches = isFiltered 
                    ? visibleMatches.filter(m => m.leagueId === selectedStandingsLeagueFilter)
                    : visibleMatches;

                // 1. Encontrar Líder (General o de Liga)
                let topTeams = [];
                let maxPoints = -1;

                targetLeagues.forEach(league => {
                    const standings = calculateStandings(league.id, visibleTeams, visibleMatches);
                    if (standings.length > 0) {
                        const top = standings[0];
                        if (top.points > maxPoints) {
                            maxPoints = top.points;
                            topTeams = [top.teamName];
                        } else if (top.points === maxPoints && maxPoints > 0) {
                            if (!topTeams.includes(top.teamName)) {
                                topTeams.push(top.teamName);
                            }
                        }
                    }
                });

                const leaderTeam = topTeams.length > 0 ? topTeams.join(' / ') : 'Por definir';

                // 2. Encontrar Máximo Anotador (General o de Liga)
                let allScorers = [];
                targetLeagues.forEach(league => {
                    const scorers = calculateTopScorers(league.id, visibleMatches, visiblePlayers, visibleTeams);
                    allScorers = [...allScorers, ...scorers];
                });
                allScorers.sort((a, b) => b.goals - a.goals);
                const topScorer = allScorers.length > 0 ? `${allScorers[0].playerName} (${allScorers[0].goals})` : 'Sin registro';

                // 3. Conteo de partidos jugados
                const totalMatchesPlayed = targetMatches.filter(m => m.scoreHome !== null).length;

                // 4. Conteo total de puntos/goles
                const totalScores = targetMatches.reduce((acc, m) => acc + (m.scoreHome || 0) + (m.scoreAway || 0), 0);

                const scoringInfo = getSportScoringInfo(currentSport);

                return {
                    leaderTeam,
                    leaderTitle: isFiltered ? 'Líder de Liga' : 'Líder General',
                    topScorer,
                    scorerTitle: isFiltered ? 'Goleador de Liga' : scoringInfo.leaderTitle,
                    totalMatchesPlayed,
                    totalScores
                };
            }, [selectedStandingsLeagueFilter, visibleLeagues, visibleTeams, visibleMatches, visiblePlayers, calculateStandings, calculateTopScorers, currentSport]);

            // VISTA PÚBLICA DE CLASIFICACIONES
            const StandingsView = () => (
                <div className="p-4 md:p-8 space-y-8 max-w-7xl mx-auto">
                    {/* Hero Banner Dinámico por Deporte */}
                    <SportsHeroBanner
                        sport={currentSport}
                        tournamentName={currentTournament?.name}
                        leaderTeam={heroStats.leaderTeam}
                        leaderTitle={heroStats.leaderTitle}
                        topScorer={heroStats.topScorer}
                        scorerTitle={heroStats.scorerTitle}
                        totalMatchesPlayed={heroStats.totalMatchesPlayed}
                        totalScores={heroStats.totalScores}
                    />

                    {/* Filtros de Torneo y Liga */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {tournaments.length > 0 ? (
                            <div className="card p-2 flex items-center space-x-2">
                                <span className="pl-4 text-xl">🏆</span>
                                <select value={selectedTournamentId} onChange={(e) => setSelectedTournamentId(e.target.value)} className="bg-transparent p-3 font-bold font-outfit text-slate-800 dark:text-white focus:outline-none cursor-pointer w-full text-base">
                                    {tournaments.map(t => <option key={t.id} value={t.id}>{t.name} ({t.sport || 'Fútbol'})</option>)}
                                </select>
                            </div>
                        ) : (
                            <p className="text-center text-slate-500 dark:text-slate-400 py-6 bg-white dark:bg-slate-800/60 rounded-2xl shadow-sm col-span-full">No hay torneos creados aún.</p>
                        )}

                        {visibleLeagues.length > 0 && (
                            <div className="card p-2 flex items-center space-x-2">
                                <span className="pl-4 text-xl">⚽</span>
                                <select value={selectedStandingsLeagueFilter} onChange={(e) => setSelectedStandingsLeagueFilter(e.target.value)} className="bg-transparent p-3 font-bold font-outfit text-slate-800 dark:text-white focus:outline-none cursor-pointer w-full text-base">
                                    <option value="">Todas las Ligas de Secundaria</option>
                                    {visibleLeagues.sort(sortLeagues).map(league => <option key={league.id} value={league.id}>{league.name}</option>)}
                                </select>
                            </div>
                        )}
                    </div>

                    {/* Tablas por Liga */}
                    {visibleLeagues.filter(l => selectedStandingsLeagueFilter ? l.id === selectedStandingsLeagueFilter : true).sort(sortLeagues).map(league => (
                        <div key={league.id} className="card p-6 md:p-8 space-y-6 animate-fade-in-up">
                            <div className="flex items-center border-b border-slate-100 dark:border-slate-700 pb-4">
                                <h3 className="text-2xl font-bold font-outfit text-slate-900 dark:text-white flex items-center">
                                    <SportIcon sport={league.sport} /> {league.name}
                                </h3>
                                {league.sport && <span className="ml-auto text-xs font-bold font-outfit text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-full uppercase">{league.sport}</span>}

                            <div className="flex flex-col lg:flex-row lg:space-x-8 space-y-8 lg:space-y-0">

                                        <StandingsTable standings={calculateStandings(league.id, visibleTeams, visibleMatches)} onTeamClick={handleTeamClick} />
                                    </div>
                                    <div>
                                        <h4 className="text-lg font-bold font-outfit text-slate-800 dark:text-slate-200 mb-4 flex items-center"><CalendarIcon className="w-5 h-5 mr-2 text-[#101097]" /> Últimos Marcadores</h4>
                                        <ResultsList matches={visibleMatches.filter(m => m.leagueId === league.id)} getTeamName={getTeamName} getTeamLogo={getTeamLogo} onMatchClick={handleMatchClick} />
                                    </div>
                                </div>
                                <div className="lg:w-1/3">
                                    <h4 className="text-lg font-bold font-outfit text-slate-800 dark:text-slate-200 mb-4 flex items-center"><TrophyIcon className="w-5 h-5 mr-2 text-red-500" /> Máximos Anotadores</h4>
                                    <TopScorersTable scorers={calculateTopScorers(league.id, visibleMatches, visiblePlayers, visibleTeams)} sport={league.sport} />
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );

            // PANEL DE ADMINISTRACIÓN POR SUB-PESTAÑAS
            const AdminPanel = () => (
                <div className="p-4 md:p-8 space-y-8 max-w-7xl mx-auto">
                    {/* Navegación por Sub-pestañas */}
                    <div className="flex flex-wrap gap-2 border-b border-slate-200 dark:border-slate-700 pb-4">
                        <button onClick={() => setAdminTab('tournaments')} className={`py-2.5 px-5 rounded-xl font-bold font-outfit text-sm transition-all ${adminTab === 'tournaments' ? 'bg-[#101097] text-white shadow-md' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100'}`}>
                            🏆 Torneos & Backup
                        </button>
                        <button onClick={() => setAdminTab('teams')} className={`py-2.5 px-5 rounded-xl font-bold font-outfit text-sm transition-all ${adminTab === 'teams' ? 'bg-[#101097] text-white shadow-md' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100'}`}>
