                            ⚽ Calendario & Partidos
                        </button>
                        <button onClick={() => setAdminTab('reports')} className={`py-2.5 px-5 rounded-xl font-bold font-outfit text-sm transition-all ${adminTab === 'reports' ? 'bg-[#101097] text-white shadow-md' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100'}`}>
                            📄 Reportes & PDFs
                        </button>
                    </div>

                    {/* Sub-pestaña 1: Torneos & Backup */}
                    {adminTab === 'tournaments' && (
                        <div className="space-y-6 animate-fade-in-up">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="card p-8 space-y-4">
                                    <h3 className="text-xl font-bold font-outfit text-slate-800 dark:text-white flex items-center border-b border-slate-100 dark:border-slate-700 pb-3">Selección de Torneo</h3>
                                    {tournaments.length > 0 ? (
                                        <div className="flex flex-col md:flex-row items-stretch md:items-center gap-4">
                                            <select value={selectedTournamentId} onChange={(e) => setSelectedTournamentId(e.target.value)} className="input-modern flex-1">
                                                {tournaments.map(t => <option key={t.id} value={t.id}>{t.name} ({t.sport || 'Fútbol'})</option>)}
                                            </select>
                                            <button onClick={handleDeleteTournament} className="btn-danger flex items-center justify-center"><TrashIcon className="w-5 h-5 mr-2" />Eliminar</button>
                                        </div>
                                    ) : (
                                        <p className="text-center text-slate-500 dark:text-slate-400 py-8 bg-slate-50 dark:bg-slate-900/50 rounded-xl">No hay torneos creados. Crea uno para empezar.</p>
                                    )}
                                </div>

                                <div className="card p-8 space-y-4">
                                    <h3 className="text-xl font-bold font-outfit text-slate-800 dark:text-white flex items-center border-b border-slate-100 dark:border-slate-700 pb-3">Crear Nuevo Torneo de Secundaria</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1 font-outfit">Disciplina Deportiva</label>
                                            <select id="sport-select" value={selectedSport} onChange={(e) => setSelectedSport(e.target.value)} className="input-modern">
                                                {['Fútbol', 'Básquetbol', 'Tocho', 'Voleibol'].map(sport => <option key={sport} value={sport}>{sport}</option>)}
                                            </select>
                                        </div>
                                        <button onClick={createLeaguesAndTeams} className="btn-primary w-full flex items-center justify-center py-3"><PlusIcon className="w-5 h-5 mr-2" />Crear Torneo</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Sub-pestaña 2: Plantillas & Equipos */}
                    {adminTab === 'teams' && (
                        <div className="card p-8 space-y-6 animate-fade-in-up">
                            <h3 className="text-xl font-bold font-outfit text-slate-800 dark:text-white flex items-center border-b border-slate-100 dark:border-slate-700 pb-3">Gestión de Ligas, Días de Juego y Plantillas</h3>
                            {visibleLeagues.length === 0 ? (
                                <p className="text-center text-slate-500 dark:text-slate-400 py-4">No hay ligas creadas en este torneo.</p>
                            ) : (
                                visibleLeagues.map(league => (
                                    <LeagueCard
                                        key={league.id}
                                        league={league}
                                        teams={visibleTeams.filter(t => t.leagueId === league.id)}
                                        players={visiblePlayers}
                                        appId={appId}
                                        db={window.firebaseApp?.db}
                                        showMessage={showMessage}
                                        onMatchDayChange={handleMatchDayChange}
                                        onEditTeam={handleEditTeam}
                                        onAddPlayers={handleOpenAddPlayersModal}
                                        onAddNewTeam={handleAddNewTeam}
                                        onOpenCountrySelector={handleOpenCountrySelector}
                                    />
                                ))
                            )}
                        </div>
                    )}

                    {/* Sub-pestaña 3: Calendario & Partidos */}
                    {adminTab === 'matches' && (
                        <div className="space-y-8 animate-fade-in-up">
                            {/* Card 1: Generar Calendario Base */}
                            <div className="card p-8 space-y-6">
                                <h3 className="text-xl font-bold font-outfit text-slate-800 dark:text-white border-b border-slate-100 dark:border-slate-700 pb-3 flex items-center justify-between">
                                    <span>Generar Calendario Base del Torneo</span>
                                    {currentSport === 'Fútbol' && <span className="text-xs font-bold font-outfit bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300 px-3 py-1 rounded-full border border-amber-300 dark:border-amber-700">⚽ Torneo 1: Fútbol</span>}
                                </h3>

                                {currentSport === 'Fútbol' && (
                                    <div className="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/40 p-4 rounded-2xl space-y-3">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                            <div>
                                                <label className="block text-xs font-bold uppercase tracking-wider text-amber-800 dark:text-amber-300 mb-1 font-outfit">🎉 Fecha de Inauguración Deportiva (Sábado)</label>
                                                <p className="text-xs text-amber-700 dark:text-amber-400">Al seleccionar el sábado de inauguración, los partidos del miércoles anterior se trasladarán automáticamente a este sábado y serán <strong>Amistosos</strong>.</p>
                                            </div>
                                            <input
                                                type="date"
                                                value={currentTournament?.inaugurationDate || ''}
                                                onChange={(e) => handleInaugurationChange(e.target.value)}
                                                className="input-modern bg-white dark:bg-slate-900 sm:w-64"
                                            />
                                        </div>
                                        {currentTournament?.inaugurationDate && (
                                            <div className="pt-2 border-t border-amber-200 dark:border-amber-800/40 flex justify-end">
                                                <button
                                                    type="button"
                                                    onClick={() => printInaugurationMatches(visibleMatches, visibleLeagues, currentTournament.inaugurationDate)}
                                                    className="btn-primary text-xs py-2 px-4 bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-bold flex items-center shadow-sm hover:scale-105 transition-transform"
                                                >
                                                    🖨️ Imprimir Rol de la Inauguración Deportiva ({currentTournament.inaugurationDate})
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1 font-outfit">Fecha de Inicio (Calendario Base - Miércoles)</label>
                                    <input type="date" value={scheduleStartDate} onChange={(e) => setScheduleStartDate(e.target.value)} className="input-modern" />
                                </div>

                                <div className="flex flex-wrap gap-4 pt-2">
                                    <button onClick={() => generateSchedule(visibleLeagues, visibleTeams)} className="btn-primary flex-1 min-w-[200px] flex items-center justify-center">
                                        <CalendarIcon className="w-5 h-5 mr-2" />Generar Calendario Base
                                    </button>
                                    {visibleMatches.length > 0 && (
                                        <button onClick={() => handleDeleteSchedule(visibleLeagueIds)} className="btn-danger flex-1 min-w-[200px] flex items-center justify-center">
                                            <TrashIcon className="w-5 h-5 mr-2" />Borrar Calendario del Torneo
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Card 2: Calendario Interactivo de Jornadas */}
                            <InteractiveCalendar
                                matches={visibleMatches}
                                selectedDateFilter={selectedDateFilter}
                                onSelectDate={(d) => setSelectedDateFilter(d)}
                                inaugurationDate={currentTournament?.inaugurationDate}
                            />

                            {/* Card 3: Administrar Partidos y Marcadores */}
                            <div className="card p-8 space-y-6">
                                <h3 className="text-xl font-bold font-outfit text-slate-800 dark:text-white flex items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                                    ⚽ Administrar Partidos y Marcadores
                                </h3>
                                <div className="flex flex-col md:flex-row items-stretch md:items-center gap-4">
                                    <select value={selectedLeagueFilter} onChange={(e) => setSelectedLeagueFilter(e.target.value)} className="input-modern flex-1">
                                        <option value="">Filtrar por Liga</option>
                                        {visibleLeagues.sort(sortLeagues).map(league => <option key={league.id} value={league.id}>{league.name}</option>)}
                                    </select>
                                    <select value={selectedDateFilter} onChange={(e) => setSelectedDateFilter(e.target.value)} className="input-modern flex-1">
                                        <option value="">Filtrar por Fecha</option>
                                        {[...new Set(visibleMatches.map(m => m.date))].filter(Boolean).sort().map(d => <option key={d} value={d}>{d}</option>)}
                                    </select>
                                </div>
                                <MatchesView matches={visibleMatches} leagues={visibleLeagues} teams={visibleTeams} players={visiblePlayers} getLeagueName={getLeagueName} getTeamName={getTeamName} getPlayersByTeam={getPlayersByTeam} appId={appId} db={window.firebaseApp?.db} showMessage={showMessage} selectedDateFilter={selectedDateFilter} selectedLeagueFilter={selectedLeagueFilter} inaugurationDate={currentTournament?.inaugurationDate} user={user} />
                            </div>
                        </div>
                    )}

                    {/* Sub-pestaña 4: Reportes & PDFs */}
                    {adminTab === 'reports' && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-fade-in-up">
                            <div className="card p-8 space-y-4">
                                <h3 className="text-xl font-bold font-outfit text-slate-800 dark:text-white flex items-center border-b border-slate-100 dark:border-slate-700 pb-3">Informes Impresos (PDF)</h3>
                                <div className="space-y-6">
                                    <div>
                                        <p className="text-sm text-slate-600 dark:text-slate-300 mb-3 font-medium">Reporte de Próximos Partidos por Fecha (con Escudos):</p>
                                        <div className="flex flex-col md:flex-row items-stretch md:items-center gap-3">
                                            <input type="date" value={upcomingMatchesDate} onChange={(e) => setUpcomingMatchesDate(e.target.value)} className="input-modern flex-1" />
                                            <button onClick={() => generateUpcomingMatchesPdf(visibleMatches, visibleLeagues)} className="btn-primary whitespace-nowrap">📄 PDF</button>
                                            <button onClick={() => printUpcomingMatchesWindow(visibleMatches, visibleLeagues)} className="btn-secondary whitespace-nowrap bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-md transition-all">🖨️ Vista Previa e Imprimir</button>
                                        </div>
                                    </div>
                                    <div className="border-t border-slate-100 dark:border-slate-700 pt-6">
                                        <p className="text-sm text-slate-600 dark:text-slate-300 mb-3 font-medium">Reporte Completo de Clasificaciones:</p>
                                        <button onClick={() => generateStandingsAndTopScorersPdf(visibleLeagues, visibleTeams, visibleMatches, visiblePlayers)} className="btn-primary w-full">PDF Clasificación y Goleo</button>
                                    </div>
                                </div>
                            </div>

                            <div className="card p-8 space-y-4">
                                <h3 className="text-xl font-bold font-outfit text-slate-800 dark:text-white flex items-center border-b border-slate-100 dark:border-slate-700 pb-3">Cédulas de Arbitraje</h3>
                                <p className="text-sm text-slate-600 dark:text-slate-300">Imprimir cédulas oficiales de partido con listas de jugadores, espacios para marcador, observaciones y firmas.</p>
                                <div className="flex flex-col md:flex-row items-stretch md:items-center gap-3">
                                    <input type="date" value={refereeMatchDate} onChange={(e) => setRefereeMatchDate(e.target.value)} className="input-modern flex-1" />
                                    <button onClick={() => generateRefereeSheetPdf(visibleMatches, visiblePlayers, visibleLeagues)} className="btn-primary whitespace-nowrap">📄 PDF</button>
                                    <button onClick={() => printRefereeSheetWindow(visibleMatches, visiblePlayers, visibleLeagues)} className="btn-secondary whitespace-nowrap bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-md transition-all">🖨️ Vista Previa e Imprimir</button>
                                </div>
                            </div>

                            {/* Card 3: Roster de Equipos y Jugadores */}
                            <div className="card p-8 space-y-4 lg:col-span-2">
                                <h3 className="text-xl font-bold font-outfit text-slate-800 dark:text-white flex items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                                    📋 Cédula de Inscripción: Equipos y Jugadores por Liga
                                </h3>
                                <p className="text-sm text-slate-600 dark:text-slate-300">
                                    Genera la lista oficial y ordenada de todas las ligas, mostrando cada equipo con su escudo (Champions League) y la nómina completa de alumnos inscritos.
                                </p>
                                <div className="flex flex-wrap gap-4 pt-2">
                                    <button onClick={() => generateTeamsAndPlayersRosterPdf(visibleLeagues, visibleTeams, visiblePlayers)} className="btn-primary flex-1 min-w-[220px] flex items-center justify-center">
                                        📄 Descargar PDF Roster Completo
                                    </button>
                                    <button onClick={() => printTeamsAndPlayersRosterWindow(visibleLeagues, visibleTeams, visiblePlayers)} className="btn-primary flex-1 min-w-[220px] flex items-center justify-center bg-gradient-to-r from-indigo-700 to-blue-800">
                                        🖨️ Imprimir / Vista Previa Roster (HTML)
                                    </button>
                                </div>
                            </div>

                            {/* Card 4: Resumen de la Jornada para Redes Sociales */}
                            <div className="card p-8 space-y-4 lg:col-span-2 border-l-4 border-amber-500">
                                <h3 className="text-xl font-bold font-outfit text-slate-800 dark:text-white flex items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                                    📱 Resumen de la Jornada para Redes Sociales (Facebook / Instagram)
                                </h3>
                                <p className="text-sm text-slate-600 dark:text-slate-300">
                                    Genera la tarjeta visual del resumen semanal con los partidos jugados por grupo, máximos anotadores (incluyendo empates) y la programación completa de la próxima jornada.
                                </p>
                                <div className="flex flex-wrap gap-4 pt-2">
                                    <button onClick={() => printFacebookSummaryWindow(visibleMatches, visibleLeagues, visibleTeams, visiblePlayers, upcomingMatchesDate)} className="btn-primary flex-1 min-w-[220px] flex items-center justify-center bg-gradient-to-r from-amber-600 to-amber-700 text-white font-bold">
                                        📷 Generar Tarjeta Visual (Vista Previa / Imprimir)
                                    </button>
                                    <button onClick={() => copyFacebookSummaryText(visibleMatches, visibleLeagues, visibleTeams, visiblePlayers, upcomingMatchesDate)} className="btn-secondary flex-1 min-w-[220px] flex items-center justify-center bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-4 rounded-xl shadow-md transition-all">
                                        📋 Copiar Texto Formateado para Facebook
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            const renderView = () => {
                if (isLoading && !isAuthReady) {
                    return (
                        <div className="flex flex-col items-center justify-center min-h-[70vh]">
                            <div className="animate-spin rounded-full h-20 w-20 border-t-4 border-b-4 border-[#101097] dark:border-blue-400"></div>
                            <p className="mt-6 text-[#101097] dark:text-blue-300 text-lg font-bold font-outfit tracking-widest uppercase">Cargando Sistema Ligas La Salle...</p>
                        </div>
                    );
                }
                switch (view) {
                    case 'standings':
                        return <StandingsView />;
                    case 'admin':
                        return user ? (
                            <AdminPanel />
                        ) : (
                            <div className="flex items-center justify-center min-h-[75vh] p-4">
                                <div className="card p-10 max-w-md w-full text-center animate-fade-in-up border-t-4 border-[#101097]">
                                    <div className="w-20 h-20 mx-auto mb-6 bg-indigo-50 dark:bg-indigo-900/30 rounded-full flex items-center justify-center">
                                        <LockIcon className="w-10 h-10 text-[#101097] dark:text-blue-400" />
                                    </div>
                                    <h3 className="text-2xl font-bold font-outfit mb-2 text-slate-900 dark:text-white">Acceso Administrador</h3>
                                    <p className="text-slate-500 dark:text-slate-400 mb-8 text-sm">Ingresa con tus credenciales institucionales para administrar torneos de Secundaria.</p>
                                    <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="input-modern mb-3" placeholder="Correo electrónico" />
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') handleLogin(); }} className="input-modern mb-6" placeholder="Contraseña" />
                                    <button onClick={handleLogin} className="btn-primary w-full py-3">Ingresar al Panel</button>
                                </div>
                            </div>
                        );
                    default:
                        return <StandingsView />;
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white transition-colors duration-300">
                    {/* Cabecera Institucional */}
                    <nav className="bg-[#101097] dark:bg-slate-950 shadow-xl sticky top-0 z-40 border-b border-white/10">
                        <div className="flex flex-wrap justify-between items-center max-w-7xl mx-auto px-4 py-3 gap-2">
                            <div className="flex items-center space-x-3">
                                <img src="https://i.imgur.com/pbiHVPL.png" alt="Escudo La Salle" className="w-10 h-10 object-contain drop-shadow-md bg-white rounded-full p-0.5" />
                                <span className="text-white font-extrabold font-outfit text-xl tracking-tight">
                                    Ligas <span className="text-blue-300">La Salle</span>
                                </span>
                                <span className="bg-white/20 text-white rounded-full uppercase text-xs tracking-wider font-bold font-outfit px-3 py-1">
                                    SECUNDARIA
                                </span>
                            </div>
                            <div className="flex items-center space-x-2 flex-wrap">
                                <button onClick={() => setView('standings')} className={`nav-button ${view === 'standings' ? 'active' : ''}`}>
                                    <TrophyIcon className="inline-block w-4 h-4 mr-2" />Clasificación
                                </button>
                                <button onClick={() => setView('admin')} className={`nav-button ${view === 'admin' ? 'active' : ''}`}>
                                    <LockIcon className="inline-block w-4 h-4 mr-2" />Admin
                                </button>
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-full text-white/80 hover:text-white hover:bg-white/15 transition-colors" title="Modo Oscuro/Claro">
                                    {darkMode ? '☀️' : '🌙'}
                                </button>
                                {user && (
                                    <button onClick={handleLogout} className="nav-button bg-[#CE0E2D]/80 hover:bg-[#CE0E2D] text-white">Salir</button>
                                )}
                            </div>
                        </div>
                    </nav>
                    
                    <Ticker matches={matches} getTeamName={getTeamName} />

                    <main className="py-6 px-4">
                        {renderView()}
                    </main>
                    
                    <footer className="text-center py-8 text-slate-400 dark:text-slate-600 text-sm font-outfit">
                        &copy; {new Date().getFullYear()} Ligas Deportivas La Salle Tuxtla — Sección Secundaria. Todos los derechos reservados.
                    </footer>

                    <MatchDetailsModal match={matchDetails} onClose={() => setMatchDetails(null)} getPlayerName={getPlayerName} getTeamName={getTeamName} />
                    <EditTeamModal team={editingTeam} onClose={handleCloseEditTeam} onSave={handleUpdateTeam} showMessage={showMessage} onOpenCountrySelector={(t) => handleOpenCountrySelector(t)} />
                    <AddPlayersModal team={addingPlayersTeam} onClose={() => setAddingPlayersTeam(null)} onAdd={handleAddMultiplePlayers} showMessage={showMessage} />
                    <TeamProfileModal team={teamProfile} players={visiblePlayers} matches={visibleMatches} getTeamName={getTeamName} onClose={() => setTeamProfile(null)} />
                    <ClubSelectorModal show={showCountrySelector} onClose={() => setShowCountrySelector(false)} onSelectClub={handleSelectCountryForTeam} />
                    <Modal show={showModal} message={modalMessage} onClose={() => setShowModal(false)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Módulos de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp,
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            signOut,
            getFirestore,
            doc,
            getDoc,
            addDoc,
            setDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            collection,
            query,
            where,
            getDocs,
        };
    </script>
</body>
</html>
