<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ligas La Salle Tuxtla</title>
    <!-- Cargar las librerías de React y Babel para JSX -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Cargar la librería de Tailwind CSS desde un CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'marquee': 'marquee 25s linear infinite',
                        'fade-in-up': 'fadeInUp 0.5s ease-out',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' }
                        },
                        fadeInUp: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', 'Inter', sans-serif;
            background-color: #f3f4f6;
            background-image: radial-gradient(circle at 1px 1px, rgba(0, 0, 0, 0.05) 1px, transparent 0);
            background-size: 20px 20px;
        }
        .dark body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.05) 1px, transparent 0);
        }
        .nav-button {
            @apply flex items-center py-2 px-5 rounded-full font-medium transition-all duration-300 text-white/80 hover:bg-white/10 hover:text-white;
        }
        .nav-button.active {
            @apply bg-white text-[#101097] shadow-lg shadow-black/20;
        }
        .btn-primary {
            @apply py-2.5 px-6 bg-gradient-to-r from-[#101097] to-[#2a2ad9] text-white font-semibold rounded-xl shadow-md hover:shadow-xl hover:shadow-indigo-500/30 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#101097] transition-all duration-300;
        }
        .btn-danger {
            @apply py-2.5 px-6 bg-gradient-to-r from-[#CE0E2D] to-[#ff4d63] text-white font-semibold rounded-xl shadow-md hover:shadow-xl hover:shadow-red-500/30 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#CE0E2D] transition-all duration-300;
        }
        .card {
            @apply bg-white dark:bg-gray-800/60 backdrop-blur-md rounded-2xl shadow-lg hover:shadow-2xl border border-gray-100 dark:border-gray-700/50 transition-all duration-300;
        }
        .input-modern {
            @apply w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-[#101097] focus:border-transparent transition-all duration-300;
        }
        /* FIX: Estilos globales para selects y opciones para que no salgan en blanco */
        select, select option {
            background-color: #ffffff;
            color: #1f2937; /* gray-800 */
        }
        .dark select, .dark select option {
            background-color: #1f2937; /* gray-800 */
            color: #ffffff;
        }
        .ticker-track {
            display: flex;
            width: max-content;
        }
        .ticker-content {
            display: flex;
            flex-direction: row;
            gap: 4rem;
            padding-right: 4rem;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #101097; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2a2ad9; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        // --- Constantes Globales ---
        const dayOptions = [ { value: 1, label: 'Lunes' }, { value: 2, label: 'Martes' }, { value: 3, label: 'Miércoles' }, { value: 4, label: 'Jueves' }, { value: 5, label: 'Viernes' }, { value: 6, label: 'Sábado' }, { value: 0, label: 'Domingo' } ];
        const leagueSortOrder = ['1ro Varonil', '1ro Femenil', '3ro Varonil', '3ro Femenil', 'Areas Varonil', 'Areas Femenil'];
        const sortLeagues = (a, b) => leagueSortOrder.indexOf(a.name) - leagueSortOrder.indexOf(b.name);

        // --- Icon Components ---
        const PlusIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" /></svg>
        );
        const CalendarIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
        );
        const TrophyIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>
        );
        const EditIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
        );
        const TrashIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
        );
        const ChevronDownIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" /></svg>
        );
        const ChevronUpIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" d="M5 15l7-7 7 7" /></svg>
        );
        const LockIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
        );
        const CloseIcon = ({ className = 'w-5 h-5' }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        );

        const SportIcon = ({ sport }) => {
            const icons = { 'Fútbol': '⚽️', 'Básquetbol': '🏀', 'Tocho': '🏈', 'Voleibol': '🏐' };
            return <span className="mr-2 text-xl">{icons[sport] || '🏆'}</span>;
        };

        const Modal = ({ show, message, onClose }) => {
            if (!show) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md p-4 animate-fade-in-up">
                    <div className="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center border-t-4 border-[#101097]">
                        <p className="text-gray-800 dark:text-white text-lg mb-6">{message}</p>
                        <button onClick={onClose} className="btn-primary w-full">Aceptar</button>
                    </div>
                </div>
            );
        };

        const TeamProfileModal = ({ team, players, matches, getTeamName, onClose }) => {
            if (!team) return null;
            const teamPlayers = players.filter(p => p.teamId === team.id).sort((a, b) => a.name.localeCompare(b.name));
            const teamMatches = matches.filter(m => m.homeTeamId === team.id || m.awayTeamId === team.id)
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .slice(0, 5); // Últimos 5 partidos

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md p-4" onClick={onClose}>
                    <div className="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto animate-fade-in-up" onClick={e => e.stopPropagation()}>
                        {/* Header del Perfil */}
                        <div className="bg-gradient-to-r from-[#101097] to-[#2a2ad9] p-8 rounded-t-3xl flex flex-col items-center text-white relative">
                            <button onClick={onClose} className="absolute top-4 right-4 p-2 text-white/80 hover:text-white hover:bg-white/10 rounded-full transition-colors" aria-label="Cerrar">
                                <CloseIcon />
                            </button>
                            <img src={team.logoUrl} alt={team.name} className="w-28 h-28 rounded-full shadow-lg border-4 border-white/20 mb-4 object-contain bg-white p-1" />
                            <h2 className="text-3xl font-extrabold tracking-tight text-center">{team.name}</h2>
                        </div>
                        
                        {/* Cuerpo del Perfil */}
                        <div className="p-6 space-y-6">
                            {/* Plantilla */}
                            <div>
                                <h3 className="text-lg font-bold mb-4 text-gray-800 dark:text-white flex items-center border-b border-gray-100 dark:border-gray-700 pb-2">
                                    <svg className="w-5 h-5 mr-2 text-[#101097]" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                    Plantilla ({teamPlayers.length})
                                </h3>
                                {teamPlayers.length > 0 ? (
                                    <div className="grid grid-cols-2 gap-3">
                                        {teamPlayers.map(p => (
                                            <div key={p.id} className="bg-gray-50 dark:bg-gray-900/50 p-3 rounded-xl flex items-center space-x-3">
                                                <div className="w-8 h-8 rounded-full bg-[#101097] text-white flex items-center justify-center font-bold text-sm">
                                                    {p.name.charAt(0).toUpperCase()}
                                                </div>
                                                <span className="text-sm font-medium text-gray-700 dark:text-gray-200 truncate">{p.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <p className="text-gray-400 text-sm text-center py-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">No hay jugadores registrados.</p>
                                )}
                            </div>

                            {/* Últimos Partidos */}
                            <div>
                                <h3 className="text-lg font-bold mb-4 text-gray-800 dark:text-white flex items-center border-b border-gray-100 dark:border-gray-700 pb-2">
                                    <CalendarIcon className="w-5 h-5 mr-2 text-[#101097]" /> Últimos Partidos
                                </h3>
                                {teamMatches.length > 0 ? (
                                    <div className="space-y-3">
                                        {teamMatches.map(m => {
                                            const isHome = m.homeTeamId === team.id;
                                            const oppId = isHome ? m.awayTeamId : m.homeTeamId;
                                            const myScore = isHome ? m.scoreHome : m.scoreAway;
                                            const oppScore = isHome ? m.scoreAway : m.scoreHome;
                                            const isWin = myScore > oppScore;
                                            const isLoss = myScore < oppScore;
                                            
                                            return (
                                                <div key={m.id} className="bg-gray-50 dark:bg-gray-900/50 p-3 rounded-xl flex items-center justify-between text-sm">
                                                    <span className="text-gray-500 w-16">{m.date}</span>
                                                    <span className={`font-bold px-2 py-1 rounded-md text-xs ${isWin ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-300' : isLoss ? 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300' : 'bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300'}`}>
                                                        {isWin ? 'G' : isLoss ? 'P' : 'E'}
                                                    </span>
                                                    <span className="font-medium text-gray-700 dark:text-gray-300 flex-1 text-right truncate ml-2">{getTeamName(oppId)}</span>
                                                    <span className="font-extrabold text-gray-800 dark:text-white ml-2 bg-white dark:bg-gray-800 px-2 py-1 rounded shadow-sm">
                                                        {myScore !== null ? `${myScore} - ${oppScore}` : 'VS'}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <p className="text-gray-400 text-sm text-center py-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">No hay partidos recientes.</p>
                                )}
                            </div>
                        </div>
                        
                        <div className="p-4 bg-gray-50 dark:bg-gray-900/50 rounded-b-3xl flex justify-end sticky bottom-0">
                            <button onClick={onClose} className="btn-primary">Cerrar Ficha</button>
                        </div>
                    </div>
                </div>
            );
        };

        const StandingsTable = ({ standings, onTeamClick }) => {
            if (standings.length === 0) {
                return <p className="text-center text-gray-500 dark:text-gray-400 py-4">No hay datos de clasificación para esta liga.</p>;
            }
            const positionColors = [
                'border-l-4 border-yellow-400 bg-yellow-50/50 dark:bg-yellow-900/10', // 1st Gold
                'border-l-4 border-gray-300 bg-gray-50/50 dark:bg-gray-700/10',      // 2nd Silver
                'border-l-4 border-orange-700 bg-orange-50/50 dark:bg-orange-900/10', // 3rd Bronze
                'border-l-4 border-transparent'
            ];
            return (
                <div className="overflow-x-auto rounded-2xl shadow-lg bg-white dark:bg-gray-800/60 backdrop-blur-md">
                    <table className="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead className="bg-gray-50 dark:bg-gray-900/50">
                            <tr>
                                <th className="px-4 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wider w-12">#</th>
                                <th className="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wider">Equipo</th>
                                {['PJ', 'G', 'E', 'P', 'GF', 'GC', 'DG', 'Pts'].map(header => (
                                    <th key={header} className={`px-4 py-4 text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wider ${header === 'Pts' ? 'text-[#101097] dark:text-blue-400' : 'text-center'}`}>{header}</th>
                                ))}
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-200 dark:divide-gray-700">
                            {standings.map((team, index) => (
                                <tr key={team.id} onClick={() => onTeamClick(team.id)} className={`${positionColors[index] || positionColors[3]} hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors duration-200 cursor-pointer`}>
                                    <td className="px-4 py-4 whitespace-nowrap text-sm font-bold text-gray-500 dark:text-gray-400">{index + 1}</td>
                                    <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white">
                                        <div className="flex items-center group">
                                            <img src={team.logoUrl} alt={`Logo de ${team.teamName}`} className="w-8 h-8 rounded-full mr-3 shadow-sm object-contain bg-white p-0.5" />
                                            <span className="group-hover:text-[#101097] dark:group-hover:text-blue-400 transition-colors font-semibold">{team.teamName}</span>
                                        </div>
                                    </td>
                                    <td className="px-4 py-4 text-sm text-center text-gray-600 dark:text-gray-300">{team.played}</td>
                                    <td className="px-4 py-4 text-sm text-center text-gray-600 dark:text-gray-300">{team.wins}</td>
                                    <td className="px-4 py-4 text-sm text-center text-gray-600 dark:text-gray-300">{team.draws}</td>
                                    <td className="px-4 py-4 text-sm text-center text-gray-600 dark:text-gray-300">{team.losses}</td>
                                    <td className="px-4 py-4 text-sm text-center text-gray-600 dark:text-gray-300">{team.goalsFor}</td>
                                    <td className="px-4 py-4 text-sm text-center text-gray-600 dark:text-gray-300">{team.goalsAgainst}</td>
                                    <td className="px-4 py-4 text-sm text-center text-gray-600 dark:text-gray-300">{team.goalDifference > 0 ? '+' + team.goalDifference : team.goalDifference}</td>
                                    <td className="px-4 py-4 text-sm text-center font-extrabold text-gray-900 dark:text-white bg-gray-50/50 dark:bg-gray-900/30">{team.points}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        const TopScorersTable = ({ scorers }) => {
            if (scorers.length === 0) {
                return <p className="text-center text-gray-500 dark:text-gray-400 py-4">No hay anotadores registrados.</p>;
            }
            return (
                <div className="overflow-x-auto rounded-2xl shadow-lg bg-white dark:bg-gray-800/60 backdrop-blur-md">
                    <table className="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead className="bg-gray-50 dark:bg-gray-900/50">
                            <tr>
                                <th className="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wider">Jugador</th>
                                <th className="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wider">Equipo</th>
                                <th className="px-6 py-4 text-center text-xs font-bold text-[#101097] dark:text-blue-400 uppercase tracking-wider">Goles</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-200 dark:divide-gray-700">
                            {scorers.map((scorer, index) => (
                                <tr key={index} className="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors duration-200">
                                    <td className="px-6 py-4 whitespace-nowrap text-sm font-semibold text-gray-900 dark:text-white flex items-center">
                                        {index < 3 && <span className="mr-2">{['🥇', '🥈', '🥉'][index]}</span>}
                                        {scorer.playerName}
                                    </td>
                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-600 dark:text-gray-300 flex items-center">
                                        <img src={scorer.logoUrl} className="w-5 h-5 rounded-full mr-2 shadow-sm object-contain bg-white p-0.5" alt="" />
                                        {scorer.teamName}
                                    </td>
                                    <td className="px-6 py-4 whitespace-nowrap text-sm font-extrabold text-center text-lg text-[#101097] dark:text-blue-400">{scorer.goals}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        const ResultsList = ({ matches, getTeamName, getTeamLogo, onMatchClick }) => {
            const recentMatches = matches.filter(m => m.scoreHome !== null).sort((a, b) => new Date(b.date) - new Date(a.date));
            if (recentMatches.length === 0) {
                return <p className="text-center text-sm text-gray-500 dark:text-gray-400 py-4">No hay resultados recientes.</p>;
            }
            return (
                <div className="space-y-3 mt-4">
                    {recentMatches.map(match => (
                        <div key={match.id} onClick={() => onMatchClick(match)} className="bg-gray-50 dark:bg-gray-900/50 p-4 rounded-xl hover:shadow-lg hover:bg-white dark:hover:bg-gray-800 cursor-pointer transition-all duration-200 shadow-sm border border-gray-100 dark:border-gray-700">
                            <p className="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold mb-2">{new Date(match.date).toLocaleDateString('es-ES', { year: 'numeric', month: 'short', day: 'numeric' })}</p>
                            <div className="flex items-center justify-between">
                                <div className="flex-1 text-sm font-bold flex items-center text-gray-800 dark:text-white">
                                    <img src={getTeamLogo(match.homeTeamId)} className="w-7 h-7 rounded-full mr-2 shadow-sm object-contain bg-white p-0.5" alt="" />
                                    <span className="truncate">{getTeamName(match.homeTeamId)}</span>
                                </div>
                                <div className="flex items-center space-x-2 mx-4 bg-white dark:bg-gray-800 px-3 py-1 rounded-lg shadow-sm">
                                    <span className="text-xl font-extrabold text-[#101097] dark:text-blue-400">{match.scoreHome}</span>
                                    <span className="text-xs text-gray-400">-</span>
                                    <span className="text-xl font-extrabold text-[#101097] dark:text-blue-400">{match.scoreAway}</span>
                                </div>
                                <div className="flex-1 text-sm font-bold flex items-center justify-end text-right text-gray-800 dark:text-white">
                                    <span className="truncate">{getTeamName(match.awayTeamId)}</span>
                                    <img src={getTeamLogo(match.awayTeamId)} className="w-7 h-7 rounded-full ml-2 shadow-sm object-contain bg-white p-0.5" alt="" />
                                </div>
                            </div>

        const App = () => {

            const [showModal, setShowModal] = useState(false);
            const [modalMessage, setModalMessage] = useState('');
            const [selectedSport, setSelectedSport] = useState('Fútbol');
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [selectedDateFilter, setSelectedDateFilter] = useState('');
            const [selectedLeagueFilter, setSelectedLeagueFilter] = useState('');
            const [selectedStandingsLeagueFilter, setSelectedStandingsLeagueFilter] = useState('');
            const [upcomingMatchesDate, setUpcomingMatchesDate] = useState('');
            const [refereeMatchDate, setRefereeMatchDate] = useState('');
            const [scheduleStartDate, setScheduleStartDate] = useState('');
            const [scheduleEndDate, setScheduleEndDate] = useState('');
            const [matchDetails, setMatchDetails] = useState(null);
            const [editingTeam, setEditingTeam] = useState(null);
            const [addingPlayersTeam, setAddingPlayersTeam] = useState(null);
            const [teamProfile, setTeamProfile] = useState(null); // Estado para el perfil del equipo

            const showMessage = (message) => { setModalMessage(message); setShowModal(true); };
            const handleMatchClick = (match) => { setMatchDetails(match); };
            const handleTeamClick = (teamId) => { const team = teams.find(t => t.id === teamId); if(team) setTeamProfile(team); };

            const getTeamName = useCallback((teamId) => teams.find(t => t.id === teamId)?.name || 'Equipo Desconocido', [teams]);
            const getTeamLogo = useCallback((teamId) => teams.find(t => t.id === teamId)?.logoUrl || '', [teams]);
            const getPlayerName = useCallback((playerId) => players.find(p => p.id === playerId)?.name || 'Jugador Desconocido', [players]);

            useEffect(() => {

            const generateSchedule = async (visibleLeagues, visibleTeams, isInitial) => {
                if (isInitial && !scheduleStartDate) { showMessage("Selecciona una fecha de inicio para el calendario base."); return; }
                if (!isInitial && !scheduleEndDate) { showMessage("Selecciona una fecha de fin para extender el calendario."); return; }
                setIsLoading(true);
                const { db } = window.firebaseApp;
                const { collection, doc, setDoc, getDocs, query, where, deleteDoc } = window.firebaseModules;
                const matchesRef = collection(db, `artifacts/${appId}/public/data/matches`);
                const newMatches = [];
                const leaguesWithoutDay = visibleLeagues.filter(l => l.matchDay == null).map(l => l.name).join(', ');
                if (leaguesWithoutDay) showMessage(`Ligas ignoradas por no tener día asignado: ${leaguesWithoutDay}`);
                try {
                    const visibleLeagueIds = visibleLeagues.map(l => l.id);
                    if (isInitial) {
                        const q = query(matchesRef, where("leagueId", "in", visibleLeagueIds));
                        const existingMatches = await getDocs(q);
                        await Promise.all(existingMatches.docs.map(matchDoc => deleteDoc(matchDoc.ref)));
                    }
                    let lastMatchDate = null;
                    if (!isInitial) {
                        const q = query(matchesRef, where("leagueId", "in", visibleLeagueIds));
                        const existingMatches = await getDocs(q);
                        if (!existingMatches.empty) {
                            const dates = existingMatches.docs.map(d => new Date(d.data().date));
                            lastMatchDate = new Date(Math.max.apply(null, dates));
                        }
                    }
                    const startDate = lastMatchDate ? new Date(lastMatchDate) : new Date(scheduleStartDate);
                    if(!lastMatchDate) startDate.setMinutes(startDate.getMinutes() + startDate.getTimezoneOffset());
                    const endDate = isInitial ? null : new Date(scheduleEndDate);
                    if(endDate) endDate.setMinutes(endDate.getMinutes() + endDate.getTimezoneOffset());

                    visibleLeagues.forEach(league => {
                        if (league.matchDay == null) return;
                        let leagueTeams = visibleTeams.filter(team => team.leagueId === league.id);
                        if (leagueTeams.length < 2) return;
                        if (leagueTeams.length % 2 !== 0) leagueTeams.push({ id: 'bye', name: 'Descanso' });
                        const numRounds = leagueTeams.length - 1;
                        const roundsToGenerate = isInitial ? 2 : 10; 
                        let currentRoundOffset = 0;
                        if (!isInitial && lastMatchDate) {
                           const allMatchesForLeague = matches.filter(m => m.leagueId === league.id).sort((a,b) => new Date(a.date) - new Date(b.date));
                           if(allMatchesForLeague.length > 0) {
                               const roundsPlayed = Math.ceil(allMatchesForLeague.length / (leagueTeams.length / 2));
                               currentRoundOffset = roundsPlayed;
                           }
                        }
                        for (let leg = 0; leg < roundsToGenerate; leg++) {
                            let roundTeams = [...leagueTeams];
                            const legOffset = isInitial ? leg : currentRoundOffset + leg;
                            for (let round = 0; round < numRounds; round++) {
                                let date = new Date(startDate);
                                if(isInitial) {
                                    const dayOffset = (league.matchDay - date.getDay() + 7) % 7;
                                    date.setDate(date.getDate() + dayOffset + (round * 7) + (leg * numRounds * 7));
                                } else {
                                    const baseDate = new Date(lastMatchDate);
                                    const dayOffset = (league.matchDay - baseDate.getDay() + 7) % 7;
                                    date = new Date(baseDate.setDate(baseDate.getDate() + dayOffset + 7 + (round * 7) + (leg * numRounds * 7) ));
                                }
                                if (endDate && date > endDate) continue;
                                for (let i = 0; i < roundTeams.length / 2; i++) {
                                    const home = (legOffset % 2 === 0) ? roundTeams[i] : roundTeams[roundTeams.length - 1 - i];
                                    const away = (legOffset % 2 === 0) ? roundTeams[roundTeams.length - 1 - i] : roundTeams[i];
                                    if (home.id !== 'bye' && away.id !== 'bye') {
                                        newMatches.push({ id: crypto.randomUUID(), leagueId: league.id, homeTeamId: home.id, awayTeamId: away.id, date: date.toISOString().split('T')[0], scoreHome: null, scoreAway: null, scorers: [] });
                                    }
                                }
                                roundTeams.splice(1, 0, roundTeams.pop());
                            }
                        }
                    });
                    if(newMatches.length > 0) {
                        await Promise.all(newMatches.map(match => setDoc(doc(matchesRef, match.id), match)));
                        showMessage(isInitial ? "Calendario base generado." : "Calendario extendido.");
                    } else {
                        showMessage("No se generaron nuevos partidos. La fecha de fin podría ser demasiado temprana.");
                    }
                } catch (e) { console.error("Error generating schedule:", e); showMessage("Error al generar el calendario."); } 
                setIsLoading(false);
            };

            const calculateStandings = useCallback((leagueId, visTeams, visMatches) => {
                const leagueTeams = visTeams.filter(t => t.leagueId === leagueId);
                const leagueMatches = visMatches.filter(m => m.leagueId === leagueId && m.scoreHome !== null);
                const standingsMap = leagueTeams.reduce((acc, team) => ({ 
                    ...acc, 
                    [team.id]: { 
                        id: team.id, // FIX CLAVE: Incluimos el ID para que el clic funcione
                        teamName: team.name, 
                        logoUrl: team.logoUrl, 
                        played: 0, 
                        wins: 0, 
                        draws: 0, 
                        losses: 0, 
                        points: 0, 
                        goalsFor: 0, 
                        goalsAgainst: 0, 
                        goalDifference: 0 
                    } 
                }), {});

                leagueMatches.forEach(match => {
                    const home = standingsMap[match.homeTeamId], away = standingsMap[match.awayTeamId];
                    if (!home || !away) return;
                    home.played++; away.played++;
                    home.goalsFor += match.scoreHome; home.goalsAgainst += match.scoreAway;
                    away.goalsFor += match.scoreAway; away.goalsAgainst += match.scoreHome;
                    if (match.scoreHome > match.scoreAway) { home.wins++; away.losses++; home.points += 3; }

                    else { home.draws++; away.draws++; home.points++; away.points++; }
                    home.goalDifference = home.goalsFor - home.goalsAgainst;
                    away.goalDifference = away.goalsFor - away.goalsAgainst;
                });
                return Object.values(standingsMap).sort((a, b) => b.points - a.points || b.goalDifference - a.goalDifference);

                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        const pngDataUrl = canvas.toDataURL('image/png');
                        resolve({ dataUrl: pngDataUrl, format: 'png' });

                    img.onerror = reject;
                    img.src = svgUrl;

            const urlToB64 = async (url) => {
                if (!url) return null;
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                    const contentType = res.headers.get('content-type');
                    if (!contentType || !contentType.startsWith('image/')) throw new Error(`Invalid content-type: ${contentType}`);
                    if (contentType.includes('svg')) return await svgToPngDataUrl(url);
                    else {
                        const blob = await res.blob();
                        return await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onloadend = () => resolve({ dataUrl: reader.result, format: contentType.split('/')[1] });
                            reader.onerror = reject;
                            reader.readAsDataURL(blob);
                        });
                    }
                } catch (e) {
                    console.error(`Error fetching or converting image from ${url}:`, e);

                                }
                            }

                        y = doc.autoTable.previous.finalY + 10;
                    } else { doc.text("No hay datos.", 14, y); y += 10; }

                                <button onClick={() => setView('admin')} className={`nav-button ${view === 'admin' ? 'active' : ''}`}><LockIcon className="inline-block w-5 h-5 mr-2" />Admin</button>
                                {user && (
                                    <button onClick={handleLogout} className="nav-button bg-red-500/20 hover:bg-red-500/40 text-red-100">Salir</button>
                                )}
                            </div>
                        </div>
                    </nav>
                    
                    <Ticker matches={matches} getTeamName={getTeamName} />

                    <main className="py-6 px-4">
                        {renderView()}
                    </main>
                    
                    <footer className="text-center py-8 text-gray-400 dark:text-gray-600 text-sm">
                        &copy; {new Date().getFullYear()} Ligas La Salle Tuxtla. Todos los derechos reservados.
                    </footer>

                    <MatchDetailsModal match={matchDetails} onClose={() => setMatchDetails(null)} getPlayerName={getPlayerName} getTeamName={getTeamName} />
                    <EditTeamModal team={editingTeam} onClose={handleCloseEditTeam} onSave={handleUpdateTeam} showMessage={showMessage} />
                    <AddPlayersModal team={addingPlayersTeam} onClose={() => setAddingPlayersTeam(null)} onAdd={handleAddMultiplePlayers} showMessage={showMessage} />
                    <TeamProfileModal team={teamProfile} players={visiblePlayers} matches={visibleMatches} getTeamName={getTeamName} onClose={() => setTeamProfile(null)} />
                    <Modal show={showModal} message={modalMessage} onClose={() => setShowModal(false)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <!-- Cargar los módulos de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Exportar los módulos a la ventana global para que puedan ser usados en el script de tipo "text/babel"
        window.firebaseModules = {
            initializeApp,
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            signOut,
            getFirestore,
            doc,
            getDoc,
            addDoc,
            setDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            collection,
            query,
            where,
            getDocs,
        };
    </script>
</body>
</html>
